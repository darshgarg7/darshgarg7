name: Refresh authorization ledger

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-ledger.mjs"
      - "tests/generate-ledger.test.mjs"
      - "package.json"
      - ".github/workflows/refresh-ledger.yml"

permissions:
  contents: write

concurrency:
  group: authorization-ledger
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate and publish public activity
    if: github.repository == 'darshgarg7/darshgarg7'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the generator
        run: npm test

      - name: Generate from public GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run generate

      - name: Publish the single-file output branch
        shell: bash
        run: |
          artifact="${RUNNER_TEMP}/authorization-ledger.svg"
          cp dist/authorization-ledger.svg "${artifact}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan output
          git rm -rf --ignore-unmatch .
          git clean -fdx

          cp "${artifact}" authorization-ledger.svg
          touch .nojekyll
          git add authorization-ledger.svg .nojekyll
          git commit -m "chore: refresh public activity ledger"
          git push --force origin output

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Darsh Garg — Applied AI and ML systems</title>
  <desc id="desc">A dark technical banner showing a path from problem to evidence to system to measurable value.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="72%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#14b8a6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#background)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#334155" stroke-opacity="0.8"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(54 44)">
      <rect width="42" height="42" rx="11" fill="#0f2237" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="21" y="27" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="750" letter-spacing="0.6">DG</text>
      <text x="58" y="16" fill="#f8fafc" font-size="17" font-weight="700" letter-spacing="2.6">DARSH GARG</text>
      <text x="58" y="38" fill="#7dd3fc" font-size="12" font-weight="650" letter-spacing="2">APPLIED AI · ML SYSTEMS · AGENT INFRASTRUCTURE</text>
    </g>

    <g transform="translate(54 126)">
      <text x="0" y="0" fill="#f8fafc" font-size="48" font-weight="720" letter-spacing="-1.3">Build the system.</text>
      <text x="0" y="58" fill="url(#accent)" font-size="48" font-weight="720" letter-spacing="-1.3">Make the evidence undeniable.</text>
      <text x="1" y="100" fill="#94a3b8" font-size="17" letter-spacing="0.25">Recommendation · retrieval · decision systems · trustworthy agent infrastructure</text>
    </g>

    <g transform="translate(54 302)">
      <line x1="14" y1="0" x2="1078" y2="0" stroke="#334155" stroke-width="2"/>
      <line x1="14" y1="0" x2="1078" y2="0" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.48"/>

      <g transform="translate(14)">
        <circle r="8" fill="#38bdf8"/>
        <circle r="15" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
        <text x="0" y="31" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="650" letter-spacing="1.5">PROBLEM</text>
      </g>
      <g transform="translate(368)">
        <circle r="8" fill="#22d3ee"/>
        <circle r="15" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
        <text x="0" y="31" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="650" letter-spacing="1.5">EVIDENCE</text>
      </g>
      <g transform="translate(722)">
        <circle r="8" fill="#2dd4bf"/>
        <circle r="15" fill="none" stroke="#2dd4bf" stroke-opacity="0.25"/>
        <text x="0" y="31" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="650" letter-spacing="1.5">SYSTEM</text>
      </g>
      <g transform="translate(1078)">
        <circle r="8" fill="#a3e635"/>
        <circle r="15" fill="none" stroke="#a3e635" stroke-opacity="0.25"/>
        <text x="0" y="31" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="650" letter-spacing="1.5">VALUE</text>
      </g>
    </g>
  </g>
</svg>
